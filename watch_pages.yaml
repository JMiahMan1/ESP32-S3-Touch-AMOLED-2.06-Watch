  pages:
    - id: main_page
      bg_color: 0x000000
      scrollbar_mode: "OFF"
      pad_all: 0
      border_width: 0
      widgets:
        - tileview:
            id: main_tiles
            scrollbar_mode: "OFF"
            bg_color: 0x000000
            pad_all: 0
            border_width: 0
            shadow_width: 0
            radius: 0
            tiles:
              # Tile (0,0): Control Center / Settings
              - row: 0
                column: 0
                bg_color: 0x111111 # Settings Background
                scrollbar_mode: "OFF"
                pad_all: 0
                border_width: 0
                widgets:
                  - obj:
                      id: settings_container
                      width: 100%
                      height: 100%
                      bg_color: 0x111111
                      bg_opa: COVER
                      scrollbar_mode: "OFF"
                      pad_top: 20
                      pad_bottom: 20
                      border_width: 0
                      layout:
                        type: FLEX
                        flex_flow: COLUMN
                        flex_align_main: START
                        flex_align_cross: CENTER
                        pad_row: 15
                      widgets:
                        - label:
                            text: "SYS INFO"
                            text_color: 0x888888
                            text_font: font_symbol
                            text_align: CENTER
                        
                        # Conditional Status Area
                        - obj:
                            width: 100%
                            height: 120
                            bg_opa: TRANSP
                            border_width: 0
                            layout:
                              type: FLEX
                              flex_flow: COLUMN
                              flex_align_main: CENTER
                              flex_align_cross: CENTER
                            widgets:
                              # Online Group
                              - label: 
                                  id: lbl_status_header
                                  text: "Checking..."
                                  text_font: font_symbol
                                  text_color: 0xFFFFFF
                              - label:
                                  id: lbl_status_detail
                                  text: "..."
                                  styles: [style_info]
                                  pad_top: 5
                                  
                              - button: # Action Button (Dynamic)
                                  id: btn_net_action
                                  width: 160
                                  height: 50
                                  pad_top: 10
                                  bg_color: 0x444444
                                  radius: 25
                                  widgets:
                                    - label:
                                        id: lbl_net_action
                                        text: "Wait..."
                                        align: CENTER
                                        text_font: font_symbol
                                  on_click:
                                    - lambda: |-
                                        if (id(wifi_component).is_connected()) {
                                           // Online Action
                                        } else {
                                           // Offline Action: Reset WiFi to trigger AP
                                           id(wifi_component).save_wifi_sta("", "");
                                           id(restart_button).press();
                                        }

                        # Divider
                        - obj:
                            width: 300
                            height: 1
                            bg_color: 0x333333

                        # System Controls
                        - obj:
                             width: 100%
                             height: 60
                             bg_opa: TRANSP
                             layout:
                               type: FLEX
                               flex_flow: ROW
                               flex_align_main: SPACE_EVENLY
                               flex_align_cross: CENTER
                             widgets:
                               - button: # Restart
                                    width: 80
                                    height: 50
                                    bg_color: 0x444444
                                    widgets: 
                                      - label:
                                          text: "Reboot"
                                          align: CENTER
                                          text_font: font_symbol
                                          text_size: 16
                                    on_click:
                                      - button.press: restart_button
                               
                               - obj: # Timeout Control
                                   width: 140
                                   height: 50
                                   bg_opa: TRANSP
                                   layout: 
                                      type: FLEX 
                                      flex_align_main: CENTER
                                      flex_align_cross: CENTER
                                   widgets:
                                      - label: 
                                          text: "Screen:"
                                          text_font: font_symbol
                                          text_color: 0xAAAAAA
                                      - label:
                                          id: lbl_timeout
                                          text: "5s"
                                          text_font: font_symbol
                                          pad_left: 10
                                          text_color: 0xFFFFFF


              # Tile (1,0): Main Clock (Default)
              - row: 1
                column: 0
                bg_color: 0x000000
                scrollbar_mode: "OFF"
                pad_all: 0
                border_width: 0
                widgets:
                  - obj:
                      id: clock_container
                      width: 100%
                      height: 100%
                      bg_color: 0x000000
                      bg_opa: COVER
                      scrollbar_mode: "OFF"
                      pad_all: 0
                      border_width: 0
                      widgets:
                        # Battery (Top Left)
                        - label: 
                            id: lbl_clock_bat
                            text: "--%"
                            text_font: font_symbol
                            text_color: 0xAAAAAA
                            align: TOP_LEFT
                            x: 55
                            y: 30
                        # WiFi Icon (Top Right)
                        - label: # Wifi
                            id: lbl_clock_wifi
                            text: "\U0000E63E" 
                            text_font: font_icons
                            text_color: 0x444444
                            align: TOP_RIGHT
                            x: -35
                            y: 30
                        
                        # Center Time/Date/Steps
                        - obj:
                            width: 100%
                            height: 70% 
                            align: CENTER
                            bg_opa: TRANSP
                            border_width: 0
                            layout:
                              type: FLEX
                              flex_flow: COLUMN
                              flex_align_main: CENTER
                              flex_align_cross: CENTER
                            widgets:
                              - label:
                                  id: time_label
                                  text: "12:00"
                                  width: 100%
                                  text_align: CENTER
                                  styles: [style_time]
                              - label:
                                  id: date_label
                                  text: "Mon, Jan 1"
                                  width: 100%
                                  text_align: CENTER
                                  styles: [style_date]
                              - label:
                                  id: lbl_steps
                                  text: "Steps: 0"
                                  width: 100%
                                  text_align: CENTER
                                  styles: [style_info]
                                  pad_top: 20

              # Tile (1,1): App Launcher (Swipe Right from Clock)
              - row: 1
                column: 1
                bg_color: 0x000000
                scrollbar_mode: "OFF"
                pad_all: 0
                border_width: 0
                widgets:
                  - obj:
                      id: app_launcher_container
                      width: 100%
                      height: 100%
                      bg_color: 0x000000
                      border_width: 0
                      pad_all: 0
                      layout:
                        type: FLEX
                        flex_flow: ROW_WRAP
                        flex_align_main: SPACE_EVENLY
                        flex_align_cross: CENTER
                        pad_row: 20
                      widgets:
                        - label: # Voice Status / Header
                            id: lbl_voice_status
                            text: "APPS"
                            text_font: font_symbol
                            text_color: 0x666666
                            pad_top: 40
                            pad_bottom: 10
                            text_align: CENTER
                            width: 100%

                        # Row 1 Buttons
                        - obj:
                            width: 100%
                            height: 120
                            bg_opa: TRANSP
                            border_width: 0
                            pad_all: 0
                            layout:
                              type: FLEX
                              flex_flow: ROW
                              flex_align_main: SPACE_EVENLY
                              flex_align_cross: CENTER
                            widgets:
                              - button: # Timer (Orange)
                                  width: 100
                                  height: 100
                                  styles:
                                    - style_icon_btn
                                    - style_bg_orange
                                  widgets:
                                    - label:
                                        text: "\U0000E425" # Timer Icon
                                        align: CENTER
                                        text_font: font_icons
                                  on_click:
                                    - lambda: lv_scr_load(id(page_keyboard)->obj);
                              - button: # Voice (Blue)
                                  width: 100
                                  height: 100
                                  styles:
                                    - style_icon_btn
                                    - style_bg_blue
                                  widgets:
                                    - label:
                                        text: "\U0000E029" # Mic Icon
                                        align: CENTER
                                        text_font: font_icons
                                  on_click:
                                    - voice_assistant.start:
                                    
                        - obj: # Row 2
                            width: 100%
                            height: 120
                            bg_opa: TRANSP
                            border_width: 0
                            pad_all: 0
                            layout:
                              type: FLEX
                              flex_flow: ROW
                              flex_align_main: SPACE_EVENLY
                              flex_align_cross: CENTER
                            widgets:
                              - button: # Flashlight (Yellow)
                                  width: 100
                                  height: 100
                                  styles:
                                    - style_icon_btn
                                    - style_bg_yellow
                                  widgets:
                                    - label:
                                        text: "\U0000E42E" # Flashlight Icon
                                        align: CENTER
                                        text_font: font_icons
                                        text_color: 0x000000
                                  on_click:
                                    - script.execute: flashlight_mode
                              - button: # Music (Purple)
                                  width: 100
                                  height: 100
                                  styles:
                                    - style_icon_btn
                                    - style_bg_purple
                                  widgets:
                                    - label:
                                        text: "\U0000E037" # Play Icon
                                        align: CENTER
                                        text_font: font_icons
                                  on_click:
                                    - lambda: lv_scr_load(id(page_music)->obj);
    
    # Music Page (Standalone)
    - id: page_music
      bg_color: 0x000000
      widgets:
        - obj:
            id: music_page_container
            width: 100%
            height: 100%
            bg_color: 0x000000
            pad_all: 0
            border_width: 0
            widgets:
              - label: # Header
                  text: "NOW PLAYING"
                  text_font: font_symbol
                  text_color: 0x888888
                  align: TOP_MID
                  y: 40
              
              - button: # Back Button
                  width: 60
                  height: 60
                  radius: 30
                  bg_color: 0x222222
                  align: TOP_LEFT
                  x: 20
                  y: 20
                  widgets:
                    - label:
                        text: "<"
                        align: CENTER
                        text_font: font_symbol
                  on_click:
                    - lambda: 'lv_obj_set_tile_id(id(main_tiles), 1, 0, LV_ANIM_ON);' # Back to Clock

              - obj: # Album Art Placeholder
                  width: 120
                  height: 120
                  radius: 16
                  bg_color: 0x333333
                  border_width: 0
                  align: CENTER
                  y: -40
                  layout:
                    type: FLEX
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                  widgets:
                    - label:
                        text: "No Media"
                        text_font: font_symbol
                        text_color: 0xAAAAAA
                        align: CENTER
              
              - label: # Title
                  id: lbl_music_title
                  text: "Not Playing"
                  text_font: font_symbol
                  text_color: 0xFFFFFF
                  width: 100%
                  text_align: CENTER
                  align: CENTER
                  y: 40
              
              - label: # Artist
                  id: lbl_music_artist
                  text: ""
                  text_font: font_symbol 
                  text_color: 0xAAAAAA
                  width: 100%
                  text_align: CENTER
                  align: CENTER
                  y: 70

              - obj: # Controls Row
                  width: 100%
                  height: 80
                  bg_opa: TRANSP
                  border_width: 0
                  align: BOTTOM_MID
                  y: -40
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                  widgets:
                    - button: # Prev
                        width: 60
                        height: 60
                        radius: 30
                        bg_color: 0x222222
                        widgets:
                          - label:
                              text: "\U0000E045"
                              align: CENTER
                              text_font: font_icons
                        on_click:
                          - homeassistant.service:
                              service: media_player.media_previous_track
                              data:
                                entity_id: ${media_player_entity}
                    - button: # Play/Pause
                        width: 80
                        height: 80
                        radius: 40
                        bg_color: 0x9C27B0 # Purple
                        pad_left: 20
                        pad_right: 20
                        widgets:
                          - label:
                              text: "\U0000E037" # Play
                              align: CENTER
                              text_font: font_icons
                        on_click:
                          - homeassistant.service:
                              service: media_player.media_play_pause
                              data:
                                entity_id: ${media_player_entity}
                    - button: # Next
                        width: 60
                        height: 60
                        radius: 30
                        bg_color: 0x222222
                        widgets:
                          - label:
                              text: "\U0000E044"
                              align: CENTER
                              text_font: font_icons
                        on_click:
                          - homeassistant.service:
                              service: media_player.media_next_track
                              data:
                                entity_id: ${media_player_entity}
                                          

    # Keyboard Page
    - id: page_keyboard
      bg_color: 0x000000
      widgets:
        - label:
            text: "Set Timer (Min)"
            text_font: font_symbol
            text_color: 0xFFFFFF
            align: TOP_MID
            y: 10
        - label:
            id: lbl_input_value
            text: "0"
            text_font: font_time
            text_color: 0xFFFFFF
            align: CENTER
            y: -100
        - obj:
            width: 300
            height: 300
            align: BOTTOM_MID
            y: -20
            bg_opa: TRANSP
            border_width: 0
            layout:
              type: FLEX
              flex_flow: ROW_WRAP
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_row: 10
              pad_column: 10
            widgets:
              - button: # Button 1
                  width: 80
                  height: 60
                  bg_color: 0x333333
                  widgets:
                    - label:
                        text: "1"
                        align: CENTER
                        text_font: font_symbol
                  on_click:
                    - lambda: |-
                         if (id(timer_minutes) < 99) {
                           id(timer_minutes) = id(timer_minutes) * 10 + 1;
                           lv_label_set_text_fmt(id(lbl_input_value), "%d", id(timer_minutes));
                         }
              - button: # Button 2
                  width: 80
                  height: 60
                  bg_color: 0x333333
                  widgets: 
                    - label:
                        text: "2"
                        align: CENTER
                        text_font: font_symbol
                  on_click:
                    - lambda: |-
                         if (id(timer_minutes) < 99) {
                           id(timer_minutes) = id(timer_minutes) * 10 + 2;
                           lv_label_set_text_fmt(id(lbl_input_value), "%d", id(timer_minutes));
                         }
              - button: # Button 3
                  width: 80
                  height: 60
                  bg_color: 0x333333
                  widgets: 
                    - label:
                        text: "3"
                        align: CENTER
                        text_font: font_symbol
                  on_click:
                    - lambda: |-
                         if (id(timer_minutes) < 99) {
                           id(timer_minutes) = id(timer_minutes) * 10 + 3;
                           lv_label_set_text_fmt(id(lbl_input_value), "%d", id(timer_minutes));
                         }
              - button: # Button 4
                  width: 80
                  height: 60
                  bg_color: 0x333333
                  widgets: 
                    - label:
                        text: "4"
                        align: CENTER
                        text_font: font_symbol
                  on_click:
                    - lambda: |-
                         if (id(timer_minutes) < 99) {
                           id(timer_minutes) = id(timer_minutes) * 10 + 4;
                           lv_label_set_text_fmt(id(lbl_input_value), "%d", id(timer_minutes));
                         }
              - button: # Button 5
                  width: 80
                  height: 60
                  bg_color: 0x333333
                  widgets: 
                    - label:
                        text: "5"
                        align: CENTER
                        text_font: font_symbol
                  on_click:
                    - lambda: |-
                         if (id(timer_minutes) < 99) {
                           id(timer_minutes) = id(timer_minutes) * 10 + 5;
                           lv_label_set_text_fmt(id(lbl_input_value), "%d", id(timer_minutes));
                         }
              - button: # Button 6
                  width: 80
                  height: 60
                  bg_color: 0x333333
                  widgets: 
                    - label:
                        text: "6"
                        align: CENTER
                        text_font: font_symbol
                  on_click:
                    - lambda: |-
                         if (id(timer_minutes) < 99) {
                           id(timer_minutes) = id(timer_minutes) * 10 + 6;
                           lv_label_set_text_fmt(id(lbl_input_value), "%d", id(timer_minutes));
                         }
              - button: # Button 7
                  width: 80
                  height: 60
                  bg_color: 0x333333
                  widgets: 
                    - label:
                        text: "7"
                        align: CENTER
                        text_font: font_symbol
                  on_click:
                    - lambda: |-
                         if (id(timer_minutes) < 99) {
                           id(timer_minutes) = id(timer_minutes) * 10 + 7;
                           lv_label_set_text_fmt(id(lbl_input_value), "%d", id(timer_minutes));
                         }
              - button: # Button 8
                  width: 80
                  height: 60
                  bg_color: 0x333333
                  widgets: 
                    - label:
                        text: "8"
                        align: CENTER
                        text_font: font_symbol
                  on_click:
                    - lambda: |-
                         if (id(timer_minutes) < 99) {
                           id(timer_minutes) = id(timer_minutes) * 10 + 8;
                           lv_label_set_text_fmt(id(lbl_input_value), "%d", id(timer_minutes));
                         }
              - button: # Button 9
                  width: 80
                  height: 60
                  bg_color: 0x333333
                  widgets: 
                    - label:
                        text: "9"
                        align: CENTER
                        text_font: font_symbol
                  on_click:
                    - lambda: |-
                         if (id(timer_minutes) < 99) {
                           id(timer_minutes) = id(timer_minutes) * 10 + 9;
                           lv_label_set_text_fmt(id(lbl_input_value), "%d", id(timer_minutes));
                         }
              - button: # Button 0
                  width: 80
                  height: 60
                  bg_color: 0x333333
                  widgets: 
                    - label:
                        text: "0"
                        align: CENTER
                        text_font: font_symbol
                  on_click:
                    - lambda: |-
                         if (id(timer_minutes) < 99) {
                           id(timer_minutes) = id(timer_minutes) * 10 + 0;
                           lv_label_set_text_fmt(id(lbl_input_value), "%d", id(timer_minutes));
                         }
              - button: # BackSpace
                  width: 80
                  height: 60
                  bg_color: 0x555555
                  widgets: 
                    - label:
                        text: "<"
                        align: CENTER
                        text_font: font_symbol
                  on_click:
                    - lambda: |-
                        id(timer_minutes) = id(timer_minutes) / 10;
                        lv_label_set_text_fmt(id(lbl_input_value), "%d", id(timer_minutes));
              - button: # Start
                  width: 80
                  height: 60
                  bg_color: 0x009688
                  widgets: 
                    - label:
                        text: "GO"
                        align: CENTER
                        text_font: font_symbol
                  on_click:
                     - script.execute: start_timer
    
    # Timer Countdown Page
    - id: page_timer_countdown
      bg_color: 0x000000
      widgets:
         - label:
             text: "TIMER"
             text_font: font_symbol
             text_color: 0xAAAAAA
             align: TOP_MID
             y: 20
         - label:
             id: lbl_timer_countdown
             text: "00:00"
             text_font: font_time
             text_color: 0xFFFFFF
             align: CENTER
             y: -20
         - button:
             width: 200
             height: 80
             align: BOTTOM_MID
             y: -40
             bg_color: 0x993333
             widgets:
               - label:
                   text: "CANCEL"
                   align: CENTER
                   text_font: font_symbol
             on_click:
               - lambda: |-
                   id(timer_active) = false;
                   lv_scr_load(id(main_page)->obj);

    # Timer Ringing Page
    - id: page_timer_ringing
      bg_color: 0xFF9800 # Orange background
      widgets:
         - label:
             text: "TIMER DONE!"
             text_font: font_symbol
             text_color: 0x000000
             align: CENTER
             y: -40
         - button:
             width: 200
             height: 80
             align: CENTER
             y: 40
             bg_color: 0xFFFFFF
             widgets:
               - label:
                   text: "STOP"
                   align: CENTER
                   text_font: font_symbol
                   text_color: 0x000000
             on_click:
               - switch.turn_off: timer_ringing
               - lambda: |-
                   lv_scr_load(id(main_page)->obj);
    
    # Simple Flashlight Page
    - id: page_flashlight
      bg_color: 0xFFFFFF
      widgets:
        - button:
            width: 100%
            height: 100%
            bg_opa: TRANSP
            on_click:
              - lambda: 'lv_scr_load(id(main_page)->obj);'
